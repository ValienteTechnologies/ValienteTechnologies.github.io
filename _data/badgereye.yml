tr: &DEFAULT_TR
  title: "BadgerEye"
  description: "BadgerEye — Valiente'nin Ofansif Maruziyet Yönetimi platformu. Saldırı yüzeyi yönetimi, sürekli tarama, AI pentest, insan doğrulaması, tehdit istihbaratı ve dijital risk koruması tek platformda."

  hero:
    eyebrow: "Ofansif Maruziyet Yönetimi"
    tagline: "Şirketinizi bir saldırganın gözünden görün. Kanıtlanmış güvenlik."
    description: "BadgerEye; saldırı yüzeyi keşfi, sürekli tarama, tehdit istihbaratı, dijital risk koruması ve insan doğrulamasını tek veri modelinde birleştiren bulut tabanlı maruziyet yönetimi platformudur. Gerçek dünyada sömürülebilir olanı tespit eder, doğrular ve önceliklendirir."
    points:
      - "Dış ve iç saldırı yüzeyi tek envanterde"
      - "AI pentest ve insan onaylı doğrulama"
      - "Sızmış kimlik bilgisi ve taklit alan adı izleme"
      - "Kurumsal SSO, kiracı izolasyonu, tam denetim izi"
    cta_primary: "badgereye.io'yu Ziyaret Et"
    cta_primary_url: "https://badgereye.io"
    cta_secondary: "Modülleri İncele"
    cta_secondary_anchor: "#be-modules"
    panel:
      heading: "exposure_overview"
      diff: "+3 yeni · 12 kapandı · son 24 saat"
      stats:
        - label: "Varlık"
          value: "1.284"
        - label: "Açık Bulgu"
          value: "327"
        - label: "Ort. Kapanış"
          value: "6,4 gün"
      severity_label: "önem dağılımı"
      severities:
        - name: "Kritik"
          count: 14
          type: critical
        - name: "Yüksek"
          count: 63
          type: high
        - name: "Orta"
          count: 118
          type: medium
        - name: "Düşük"
          count: 132
          type: low
      validation_label: "doğrulama durumu"
      validations:
        - name: "AI Doğrulamalı"
          count: 41
          type: ai
        - name: "İnsan Onaylı"
          count: 12
          type: confirmed

  difference:
    title: "BadgerEye Farkı"
    subtitle: "Alarm yağmuru değil — ne durumda olduğunuzu, neyin değiştiğini ve ne yapacağınızı söyleyen sakin bir kokpit."
    pillars:
      - icon: "fas fa-eye"
        title: "Her Şeyi Görün"
        desc: "Dış varlıklar, iç topoloji ve kimlikler tek grafikte. Bilinen ve bilinmeyen tüm saldırı yüzeyiniz — saldırganın gördüğü haliyle."
      - icon: "fas fa-layer-group"
        title: "Önemli Olanı Düzeltin"
        desc: "Tehdit istihbaratı ve iş etkisiyle sıralama: on binlerce bulgu değil, saldırı yollarını çökerten kritik düğüm noktaları."
      - icon: "fas fa-user-check"
        title: "Pentest Ekibimizi Ürünleştirdik"
        desc: "Yılların ofansif uzmanlığı yapay zekayla ölçeklenir; kritik bulguları gerçek pentester'lar doğrular."
    funnel:
      title: "Maruziyet hunisi"
      stages:
        - value: "11.000"
          label: "sömürülebilir maruziyet"
        - value: "~200"
          label: "kritik düğüm noktası"
        - value: "%99,6"
          label: "daha az düzeltme yükü"
    stats:
      - value: "%42"
        label: "SOC zamanı sömürülemez bulgulara harcanıyor"
      - value: "%96"
        label: "kurum sömürülebilirliği ölçekte doğrulayamıyor"
      - value: "<%40"
        label: "kurumda sürekli doğrulama var"
    stats_note: "Kaynak: sektör araştırmaları"

  modules:
    title: "Modüler Tasarım, Tek Platform"
    subtitle: "Güvenlik bir proje değil, bir yolculuk. Her modül aynı varlık grafiği üzerinde çalışır — silo yok, aktarım yok."
    list:
      - icon: "fas fa-globe"
        title: "Saldırı Yüzeyi Yönetimi"
        desc: "Alan adları, sunucular, bulut, kod depoları. Sürekli keşif. Kendini güncel tutan envanter."
      - icon: "fas fa-crosshairs"
        title: "Sürekli Zafiyet Taraması"
        desc: "Ağ, web uygulaması, bulut, konteyner ve kod. Hedefe göre profiller. Normalize edilmiş, tekilleştirilmiş sonuçlar."
      - icon: "fas fa-robot"
        title: "AI Pentest"
        desc: "Ofansif uzmanlık, yapay zekayla ölçeklenmiş. Sömürülebilirlik sınaması. Saldırı zincirleri, kanıtıyla."
      - icon: "fas fa-user-check"
        title: "İnsan Doğrulaması & Yeniden Test"
        desc: "Kritik bulguları gerçek pentester'lar onaylar. Tek tıkla yeniden test. Döngü kapanır."
      - icon: "fas fa-satellite-dish"
        title: "Tehdit İstihbaratı"
        desc: "EPSS, istismar olgunluğu, fidye yazılımı takibi. Sektörünüzü kimin hedef aldığı. Size göre istihbarat."
      - icon: "fas fa-user-secret"
        title: "Dijital Risk Koruması"
        desc: "Sızmış kimlik bilgileri. Taklit alan adları. Dark web maruziyeti — kendi saldırı yüzeyinizle ilişkilendirilmiş."
      - icon: "fas fa-project-diagram"
        title: "Saldırı Yolu Grafiği"
        desc: "Dış ayak izinden Domain Admin'e. Kimlik, ağ ve kimlik bilgisi tek yolda. Zinciri kıran düğümü gösterir."
      - icon: "fas fa-route"
        title: "Otomasyon & Playbook'lar"
        desc: "Görsel playbook tasarımcısı. Düzeltme iş akışları. Bildirim, biletleme, otomatik kapanış."
      - icon: "fas fa-file-alt"
        title: "Raporlama & Uyumluluk"
        desc: "Yönetici özetinden denetim kanıtına. Markalı PDF raporlar. Canlıda gördüğünüzle birebir aynı sinyal."

  validation:
    title: "Teori Değil, Kanıt"
    subtitle: "Her maruziyet bir doğrulama durumu taşır. Neyin gerçekten sömürülebilir olduğunu bilirsiniz — tahmin etmezsiniz."
    ladder:
      - type: unvalidated
        name: "Doğrulanmamış"
        desc: "Tarayıcı bulgusu. Bir sinyal — henüz kanıt değil."
      - type: ai
        name: "AI Doğrulamalı"
        desc: "Yapay zeka sömürülebilirliği güvenli biçimde sınadı."
      - type: confirmed
        name: "İnsan Onaylı"
        desc: "Bir pentester doğruladı. Tartışmasız, raporlanabilir kanıt."
    loop_title: "Döngüyü kapatın"
    loop_desc: "Düzelttiniz mi? Tek tıkla yeniden test — bulgu kendiliğinden kapanır. \"Bir şey değiştirdim — işe yaradı mı?\" sorusunun cevabı üründe, tahminde değil."

  lifecycle:
    title: "CTEM Döngüsü"
    subtitle: "BadgerEye, Sürekli Tehdit Maruziyeti Yönetimi (CTEM) döngüsünün beş adımını uçtan uca işletir."
    steps:
      - title: "Kapsamlama"
        desc: "İş açısından kritik varlıklar ve sınırlar tanımlanır."
      - title: "Keşif"
        desc: "Saldırı yüzeyi ve zafiyetler sürekli taranır."
      - title: "Önceliklendirme"
        desc: "Bulgular istihbarat ve iş etkisiyle sıralanır."
      - title: "Doğrulama"
        desc: "Sömürülebilirlik doğrulanır, gürültü elenir."
      - title: "Aksiyon"
        desc: "Düzeltme atanır, izlenir ve kapatılır."

  compare:
    title: "Neden BadgerEye?"
    subtitle: "İki dünyanın da eksiği var. BadgerEye ikisini tek varlık grafiğinde birleştirir."
    cols:
      - title: "Otomatik Platformlar"
        desc: "Sürekli ama teorik: doğrulanmamış bulgu listeleri, alarm yorgunluğu."
        verdict: "Sürekli, kanıtsız"
      - title: "Pentest Firmaları"
        desc: "Doğrulanmış ama anlık: rapor, teslim edildiği gün eskimeye başlar."
        verdict: "Kanıtlı, anlık"
      - title: "BadgerEye"
        desc: "Sürekli VE insan onaylı — tek varlık grafiği üzerinde, kesintisiz."
        verdict: "İkisi birden"
        highlight: true

  healthcheck:
    title: "Maruziyetinizi Merak mı Ediyorsunuz?"
    desc: "Ücretsiz HealthCheck ile başlayın: internete açık sistemlerinizin temel güvenlik durumunu değerlendirelim, sonucu kısa ve anlaşılır bir raporla sunalım. Taahhüt yok, kesinti yok."
    cta_button: "Ücretsiz HealthCheck"
    cta_url: "/projects/healthcheck/"
    logos_title: "HealthCheck'e güvenenler"
    logos:
      - title: "Tactical Europe"
        logo: /assets/img/clients/teurope.png
      - title: "Max Security International"
        logo: /assets/img/clients/maxguvenlik.png
      - title: "Megasaray Hotels"
        logo: /assets/img/clients/megasarayhotels.png
      - title: "Şahinler Holding"
        logo: /assets/img/clients/sahinler.png

  cta:
    title: "Saldırı yüzeyinizi BadgerEye ile yönetin"
    description: "Platformu yakından incelemek ve erişim talep etmek için badgereye.io'yu ziyaret edin."
    button: "badgereye.io'ya Git"
    url: "https://badgereye.io"

tr-TR:
  <<: *DEFAULT_TR

en:
  title: "BadgerEye"
  description: "BadgerEye — Valiente's Offensive Exposure Management platform. Attack surface management, continuous scanning, AI pentesting, human validation, threat intelligence and digital risk protection in one platform."

  hero:
    eyebrow: "Offensive Exposure Management"
    tagline: "See your whole company as an attacker does. Confidence, proven."
    description: "BadgerEye is the cloud-native exposure management platform that unifies attack surface discovery, continuous scanning, threat intelligence, digital risk protection and human validation on a single data model. It finds, proves and prioritizes what is exploitable in the real world."
    points:
      - "External and internal attack surface in one inventory"
      - "AI pentesting with human-confirmed validation"
      - "Leaked-credential and lookalike-domain monitoring"
      - "Enterprise SSO, tenant isolation, full audit trail"
    cta_primary: "Visit badgereye.io"
    cta_primary_url: "https://badgereye.io"
    cta_secondary: "Explore the Modules"
    cta_secondary_anchor: "#be-modules"
    panel:
      heading: "exposure_overview"
      diff: "+3 new · 12 closed · last 24 hours"
      stats:
        - label: "Assets"
          value: "1,284"
        - label: "Open Findings"
          value: "327"
        - label: "Avg. Closure"
          value: "6.4 days"
      severity_label: "severity distribution"
      severities:
        - name: "Critical"
          count: 14
          type: critical
        - name: "High"
          count: 63
          type: high
        - name: "Medium"
          count: 118
          type: medium
        - name: "Low"
          count: 132
          type: low
      validation_label: "validation state"
      validations:
        - name: "AI-Validated"
          count: 41
          type: ai
        - name: "Human-Confirmed"
          count: 12
          type: confirmed

  difference:
    title: "The BadgerEye Difference"
    subtitle: "Not an alert firehose — a calm cockpit that tells you where you stand, what changed, and what to do next."
    pillars:
      - icon: "fas fa-eye"
        title: "See Everything"
        desc: "External assets, internal topology and identities on one graph. Your whole attack surface — known and unknown — the way an attacker sees it."
      - icon: "fas fa-layer-group"
        title: "Fix What Matters"
        desc: "Ranked by threat intelligence and business impact: not tens of thousands of findings — the choke points that collapse attack paths."
      - icon: "fas fa-user-check"
        title: "We Productized Our Pentest Team"
        desc: "Years of offensive expertise scaled with AI; critical findings confirmed by real pentesters."
    funnel:
      title: "The exposure funnel"
      stages:
        - value: "11,000"
          label: "exploitable exposures"
        - value: "~200"
          label: "critical choke points"
        - value: "99.6%"
          label: "less remediation scope"
    stats:
      - value: "42%"
        label: "of SOC time is spent on non-exploitable findings"
      - value: "96%"
        label: "of organizations can't validate exploitability at scale"
      - value: "<40%"
        label: "have continuous validation in place"
    stats_note: "Source: industry research"

  modules:
    title: "Modular by Design, One Platform"
    subtitle: "Security is a journey, not a project. Every module runs on the same asset graph — no silos, no hand-offs."
    list:
      - icon: "fas fa-globe"
        title: "Attack Surface Management"
        desc: "Domains, hosts, cloud, code repositories. Continuous discovery. An inventory that keeps itself current."
      - icon: "fas fa-crosshairs"
        title: "Continuous Vulnerability Scanning"
        desc: "Network, web app, cloud, container and code. Intent-driven profiles. Normalized, deduplicated results."
      - icon: "fas fa-robot"
        title: "AI Pentesting"
        desc: "Offensive expertise, scaled by AI. Exploitability testing. Attack chains, with proof."
      - icon: "fas fa-user-check"
        title: "Human Validation & Retest"
        desc: "Real pentesters confirm critical findings. One-click retest. The loop closes."
      - icon: "fas fa-satellite-dish"
        title: "Threat Intelligence"
        desc: "EPSS, exploit maturity, ransomware tracking. Who targets your sector. Intelligence relative to you."
      - icon: "fas fa-user-secret"
        title: "Digital Risk Protection"
        desc: "Leaked credentials. Lookalike domains. Dark-web exposure — correlated with your own attack surface."
      - icon: "fas fa-project-diagram"
        title: "Attack Path Graph"
        desc: "From external foothold to Domain Admin. Identity, network and credentials on one path. Shows the node that breaks the chain."
      - icon: "fas fa-route"
        title: "Automation & Playbooks"
        desc: "Visual playbook builder. Remediation workflows. Notifications, ticketing, auto-close."
      - icon: "fas fa-file-alt"
        title: "Reporting & Compliance"
        desc: "From executive summary to audit evidence. Branded PDF reports. The same signal you see live in the product."

  validation:
    title: "Proof, Not Theory"
    subtitle: "Every exposure carries a validation state. You know what's actually exploitable — you don't guess."
    ladder:
      - type: unvalidated
        name: "Unvalidated"
        desc: "A scanner finding. A signal — not yet proof."
      - type: ai
        name: "AI-Validated"
        desc: "AI safely tested exploitability."
      - type: confirmed
        name: "Human-Confirmed"
        desc: "Confirmed by a pentester. Defensible, reportable proof."
    loop_title: "Close the loop"
    loop_desc: "Fixed it? One-click retest — the finding closes itself. \"I changed something — did it matter?\" is answered by the product, not by guesswork."

  lifecycle:
    title: "The CTEM Loop"
    subtitle: "BadgerEye operates all five stages of Continuous Threat Exposure Management end to end."
    steps:
      - title: "Scoping"
        desc: "Business-critical assets and boundaries are defined."
      - title: "Discovery"
        desc: "The attack surface and its exposures are scanned continuously."
      - title: "Prioritization"
        desc: "Findings are ranked by intelligence and business impact."
      - title: "Validation"
        desc: "Exploitability is verified and noise is eliminated."
      - title: "Mobilization"
        desc: "Remediation is assigned, tracked and closed."

  compare:
    title: "Why BadgerEye?"
    subtitle: "Both worlds fall short on their own. BadgerEye merges them on one asset graph."
    cols:
      - title: "Automated Platforms"
        desc: "Continuous but theoretical: unvalidated finding lists, alert fatigue."
        verdict: "Continuous, unproven"
      - title: "Pentest Firms"
        desc: "Validated but point-in-time: the report starts aging the day it's delivered."
        verdict: "Proven, point-in-time"
      - title: "BadgerEye"
        desc: "Continuous AND human-proven — on one asset graph, without interruption."
        verdict: "Both"
        highlight: true

  healthcheck:
    title: "Wondering What Your Exposure Looks Like?"
    desc: "Start with a free HealthCheck: we assess the baseline security posture of your internet-facing systems and hand you a short, clear report. No commitment, no disruption."
    cta_button: "Free HealthCheck"
    cta_url: "/projects/healthcheck/"
    logos_title: "Trusted for HealthCheck"
    logos:
      - title: "Tactical Europe"
        logo: /assets/img/clients/teurope.png
      - title: "Max Security International"
        logo: /assets/img/clients/maxguvenlik.png
      - title: "Megasaray Hotels"
        logo: /assets/img/clients/megasarayhotels.png
      - title: "Şahinler Holding"
        logo: /assets/img/clients/sahinler.png

  cta:
    title: "Manage your attack surface with BadgerEye"
    description: "Visit badgereye.io to take a closer look at the platform and request access."
    button: "Go to badgereye.io"
    url: "https://badgereye.io"
