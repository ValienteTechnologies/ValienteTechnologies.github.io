        title: "Uyumluluk ve Raporlama"
        desc: "Yönetici özeti, uyumluluk durumu ve denetim kanıtı tek yerde."
      - chip: "MSS"
        icon: "fas fa-user-shield"
        title: "Yönetilen Güvenlik"
        desc: "Platformu biz işletiriz; kritik bulguları uzman ekip doğrular."

