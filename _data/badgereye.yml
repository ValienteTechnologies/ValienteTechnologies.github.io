    pillars:
      - icon: "fas fa-eye"
        title: "Tek Envanter"
        desc: "Alan adları, sunucular, bulut kaynakları ve kimlikler tek grafikte durur. Dışarıdan görünen yüzey ile iç ağınız aynı haritada birleşir."
      - icon: "fas fa-layer-group"
        title: "Önceliklendirme"
        desc: "Binlerce bulgu tehdit istihbaratı ve iş etkisiyle süzülür. Önce, saldırı yollarını kapatan az sayıdaki kritik nokta gelir."
      - icon: "fas fa-sync-alt"
        title: "Süreklilik"
        desc: "Tarama bittiğinde iş bitmez. Platform neyin yeni, neyin kapandığını izler; düzelttiğiniz bulgular yeniden test edilir ve kendiliğinden kapanır."
