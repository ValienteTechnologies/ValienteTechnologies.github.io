  <<: *DEFAULT_TR

en:
  title: "BadgerEye"
  description: "BadgerEye is Valiente's cloud-based Unified Vulnerability Management (UVM) and CTEM platform. Attack surface management, continuous scanning, AI pentesting, threat intelligence and digital risk protection in one platform."

  hero:
    eyebrow: "Unified Vulnerability Management + CTEM"
    tagline: "See your attack surface the way an attacker does."
    description: "BadgerEye is the cloud-based vulnerability and exposure management platform built by Valiente. It brings asset discovery, vulnerability scanning, threat intelligence and digital risk protection together on a single data model, then finds and prioritizes the risks that are actually exploitable."
    points:
      - "External and internal attack surface in one inventory"
      - "Prioritization driven by threat intelligence"
      - "Leaked credential and lookalike domain tracking"
      - "Enterprise SSO, tenant isolation and audit trail"
    cta_primary: "Visit badgereye.io"
    cta_primary_url: "https://badgereye.io"
    cta_secondary: "Explore the Modules"
    cta_secondary_anchor: "#be-modules"
    panel:
      heading: "exposure_overview"
      diff: "+3 new · 12 closed · last 24 hours"
      stats:
        - label: "Assets"
          value: "1,284"
        - label: "Open Findings"
          value: "327"
        - label: "Avg. Closure"
          value: "6.4 days"
      severity_label: "severity distribution"
      severities:
        - name: "Critical"
          count: 14
          type: critical
        - name: "High"
          count: 63
          type: high
        - name: "Medium"
          count: 118
          type: medium
        - name: "Low"
          count: 132
          type: low

  difference:
    title: "Why BadgerEye?"
    subtitle: "The goal is not to generate alerts; it is to show clearly where you stand, what changed and what comes next."
    pillars:
      - icon: "fas fa-eye"
        title: "One Inventory"
        desc: "Domains, hosts, cloud resources and identities live on one graph. Your external surface and your internal network share the same map."
      - icon: "fas fa-layer-group"
        title: "Prioritization"
        desc: "Thousands of findings are filtered with threat intelligence and business impact. The short list that closes attack paths comes first."
      - icon: "fas fa-sync-alt"
        title: "Continuity"
        desc: "The work does not end when a scan ends. The platform tracks what is new and what is resolved; fixed findings are retested and closed automatically."
    funnel:
      title: "the exposure funnel"
      stages:
        - value: "11,000"
          label: "exploitable exposures"
        - value: "~200"
          label: "critical choke points"
        - value: "99.6%"
          label: "less remediation work"
    stats:
      - value: "42%"
        label: "of SOC time goes to findings that are not exploitable"
      - value: "96%"
        label: "of organizations cannot validate exploitability at scale"
      - value: "<40%"
        label: "have continuous validation in place"
    stats_note: "Source: industry research"

  modules:
    title: "Modules"
    subtitle: "Every module runs on the same asset graph; data is never copied and silos never form."
    premium_badge: "Premium"
    list:
      - icon: "fas fa-globe"
        title: "Attack Surface Management"
        desc: "Domains, hosts, cloud and code repositories are discovered continuously; the inventory keeps itself current."
      - icon: "fas fa-crosshairs"
        title: "Continuous Vulnerability Scanning"
        desc: "Network, web application, cloud, container and code scans run on goal-based profiles; results are normalized and deduplicated."
      - icon: "fas fa-robot"
        title: "AI Pentesting"
        desc: "AI safely tests exploitability and lays out attack chains with supporting evidence."
      - icon: "fas fa-satellite-dish"
        title: "Threat Intelligence"
        desc: "EPSS, exploit maturity and ransomware tracking are matched directly against your own findings."
      - icon: "fas fa-user-secret"
        title: "Digital Risk Protection"
        desc: "Leaked credentials, lookalike domains and dark web exposure are correlated with your own assets."
      - icon: "fas fa-project-diagram"
        title: "Attack Path Graph"
        desc: "Paths from an external foothold to critical systems appear on one graph; the node that breaks the chain is marked."
      - icon: "fas fa-route"
        title: "Automation and Playbooks"
        desc: "Remediation workflows are built in a visual designer; notifications, ticketing and auto-close are included."
      - icon: "fas fa-file-alt"
        title: "Reporting and Compliance"
        desc: "From executive summary to audit evidence, reports carry the same signal you see in the product."
      - icon: "fas fa-user-check"
        title: "Expert Validation"
        desc: "For customers who want it, our pentest team manually verifies critical findings and retests the fixes."
        premium: true

  lifecycle:
    title: "The CTEM Loop"
    subtitle: "BadgerEye operates all five stages of Continuous Threat Exposure Management end to end."
    steps:
      - title: "Scoping"
        desc: "Business-critical assets and boundaries are defined."
      - title: "Discovery"
        desc: "The attack surface and its exposures are scanned continuously."
      - title: "Prioritization"
        desc: "Findings are ranked by intelligence and business impact."
      - title: "Validation"
        desc: "Exploitability is verified and noise is eliminated."
      - title: "Mobilization"
        desc: "Remediation is assigned, tracked and closed."

  cta:
    title: "Manage your attack surface with BadgerEye"
    description: "Visit badgereye.io to take a closer look at the platform and request access."
    button: "Go to badgereye.io"
    url: "https://badgereye.io"
