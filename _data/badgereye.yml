        label: "SOC zamanı sömürülemez bulgulara harcanıyor"
      - value: "%96"
        label: "kurum sömürülebilirliği ölçekte doğrulayamıyor"
      - value: "<%40"
        label: "kurumda sürekli doğrulama var"
    stats_note: "Kaynak: sektör araştırmaları"

  modules:
    title: "Modüller"
    subtitle: "Her modül aynı varlık grafiği üzerinde çalışır; veri kopyalanmaz, silo oluşmaz."
    premium_badge: "Premium"
    list:
      - icon: "fas fa-globe"
        title: "Saldırı Yüzeyi Yönetimi"
        desc: "Alan adları, sunucular, bulut ve kod depoları sürekli keşfedilir; envanter kendini güncel tutar."
      - icon: "fas fa-crosshairs"
        title: "Sürekli Zafiyet Taraması"
        desc: "Ağ, web uygulaması, bulut, konteyner ve kod taramaları hedefe göre profillerle çalışır; sonuçlar normalize edilip tekilleştirilir."
      - icon: "fas fa-robot"
        title: "AI Pentest"
        desc: "Yapay zeka sömürülebilirliği güvenli biçimde sınar; saldırı zincirlerini kanıtıyla ortaya koyar."
      - icon: "fas fa-satellite-dish"
        title: "Tehdit İstihbaratı"
        desc: "EPSS, istismar olgunluğu ve fidye yazılımı takibi doğrudan sizin bulgularınızla eşleştirilir."
      - icon: "fas fa-user-secret"
        title: "Dijital Risk Koruması"
        desc: "Sızmış kimlik bilgileri, taklit alan adları ve dark web maruziyeti kendi varlıklarınızla ilişkilendirilir."
      - icon: "fas fa-project-diagram"
        title: "Saldırı Yolu Grafiği"
        desc: "Dış ayak izinden kritik sistemlere uzanan yollar tek grafikte görünür; zinciri kıran düğüm işaretlenir."
      - icon: "fas fa-route"
        title: "Otomasyon ve Playbook'lar"
        desc: "Görsel tasarımcıyla düzeltme iş akışları kurulur; bildirim, biletleme ve otomatik kapanış buna dahildir."
      - icon: "fas fa-file-alt"
        title: "Raporlama ve Uyumluluk"
        desc: "Yönetici özetinden denetim kanıtına, üründe gördüğünüz sinyalin aynısı raporlanır."
      - icon: "fas fa-user-check"
        title: "Uzman Doğrulaması"
        desc: "İsteyen müşteriler için pentest ekibimiz kritik bulguları elle doğrular, düzeltmeleri yeniden test eder."
        premium: true

  lifecycle:
    title: "CTEM Döngüsü"
    subtitle: "BadgerEye, Sürekli Tehdit Maruziyeti Yönetimi (CTEM) döngüsünün beş adımını uçtan uca işletir."
    steps:
      - title: "Kapsamlama"
        desc: "İş açısından kritik varlıklar ve sınırlar tanımlanır."
      - title: "Keşif"
        desc: "Saldırı yüzeyi ve zafiyetler sürekli taranır."
      - title: "Önceliklendirme"
        desc: "Bulgular istihbarat ve iş etkisiyle sıralanır."
      - title: "Doğrulama"
        desc: "Sömürülebilirlik doğrulanır, gürültü elenir."
      - title: "Aksiyon"
        desc: "Düzeltme atanır, izlenir ve kapatılır."

  cta:
    title: "Saldırı yüzeyinizi BadgerEye ile yönetin"
    description: "Platformu incelemek ve erişim talep etmek için badgereye.io'yu ziyaret edin."
    button: "badgereye.io'ya Git"
    url: "https://badgereye.io"

