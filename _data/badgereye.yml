tr-TR:
  <<: *DEFAULT_TR

en:
  title: "BadgerEye"
  description: "BadgerEye — Valiente's Unified Vulnerability Management (UVM) and CTEM platform. Asset discovery, vulnerability scanning, threat intelligence and reporting in one platform."

  hero:
    eyebrow: "Unified Vulnerability Management + CTEM"
    tagline: "See, prioritize and close your attack surface from a single platform."
    description: "BadgerEye is the cloud-native security platform built by Valiente: asset discovery, vulnerability scanning, threat intelligence and reporting converge on a single data model. Teams prioritize risk by business impact and track it through to closure."
    status: "SaaS Platform"
    points:
      - "Continuous asset discovery and attack surface monitoring"
      - "Network, web and cloud scans via a managed scanner fleet"
      - "Prioritization enriched with threat intelligence"
      - "Enterprise SSO, role-based access and a full audit trail"
    cta_primary: "Visit badgereye.io"
    cta_primary_url: "https://badgereye.io"
    cta_secondary: "Explore Capabilities"
    cta_secondary_anchor: "#be-capabilities"
    panel:
      heading: "exposure_overview"
      stats:
        - label: "Assets"
          value: "1,284"
        - label: "Open Findings"
          value: "327"
        - label: "Avg. Closure"
          value: "6.4 days"
      severity_label: "severity distribution"
      severities:
        - name: "Critical"
          count: 14
          type: critical
        - name: "High"
          count: 63
          type: high
        - name: "Medium"
          count: 118
          type: medium
        - name: "Low"
          count: 132
          type: low

  capabilities:
    title: "End-to-End Visibility in One Platform"
    subtitle: "Your entire attack surface on a single data model — instead of scattered scanner output and spreadsheets."
    list:
      - icon: "fas fa-globe"
        title: "Asset Inventory & Attack Surface"
        desc: "Domains, hosts, services and cloud resources are discovered continuously; the inventory keeps itself current."
      - icon: "fas fa-crosshairs"
        title: "Orchestrated Scanning"
        desc: "Network, web application and cloud scans are scheduled from one place; results are normalized and deduplicated."
      - icon: "fas fa-shield-alt"
        title: "Exposure Lifecycle"
        desc: "Findings are prioritized by business impact, assigned an owner, and tracked to closure with SLAs."
      - icon: "fas fa-user-secret"
        title: "Threat Intelligence"
        desc: "Live threat data is correlated with your assets; actively exploited vulnerabilities rise to the top."
      - icon: "fas fa-file-alt"
        title: "Reporting & Analytics"
        desc: "From executive summary to technical detail — branded PDF reports and live security posture dashboards."
      - icon: "fas fa-cloud"
        title: "Enterprise SaaS"
        desc: "Single sign-on (SSO), role-based access control, tenant isolation and a complete audit trail."

  lifecycle:
    title: "The CTEM Loop"
    subtitle: "BadgerEye operates all five stages of Continuous Threat Exposure Management end to end."
    steps:
      - title: "Scoping"
        desc: "Business-critical assets and boundaries are defined."
      - title: "Discovery"
        desc: "The attack surface and its exposures are scanned continuously."
      - title: "Prioritization"
        desc: "Findings are ranked by intelligence and business impact."
      - title: "Validation"
        desc: "Exploitability is verified and noise is eliminated."
      - title: "Mobilization"
        desc: "Remediation is assigned, tracked and closed."

  cta:
    title: "Manage your attack surface with BadgerEye"
    description: "Visit badgereye.io to take a closer look at the platform and request access."
    button: "Go to badgereye.io"
    url: "https://badgereye.io"
